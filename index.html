<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خواب نامہ یوسفی</title>
<meta name="description" content="خواب نامہ یوسفی — خوابوں کی تعبیر، 500 عنوانات، 10 ابواب میں۔">
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars-bg" aria-hidden="true"></div>

<header class="app-header">
  <div class="header-inner">
    <button id="backBtn" class="back-btn" aria-label="واپس" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 class="app-title" id="appTitle">خواب نامہ یوسفی</h1>
    <div class="moon-mark" aria-hidden="true"></div>
  </div>
  <p class="app-subtitle" id="appSubtitle">خوابوں کی تعبیر — ۵۰۰ عنوانات</p>

  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="search" id="searchInput" placeholder="کوئی لفظ تلاش کریں... مثلاً: سانپ، پانی، شادی" autocomplete="off">
    <button id="clearSearch" class="clear-search" hidden aria-label="صاف کریں">×</button>
  </div>
</header>

<main id="mainContent">

  <section id="homeView">
    <div id="stageGrid" class="stage-grid"></div>
    <p class="footer-note">تعبیرات روایتی خواب ناموں کی روشنی میں مرتب کی گئی ہیں۔ حتمی رہنمائی کے لیے اہل علم سے رجوع کریں۔</p>
  </section>

  <section id="stageView" hidden>
    <div class="stage-band" id="stageBand"></div>
    <ul id="entryList" class="entry-list"></ul>
  </section>

  <section id="searchView" hidden>
    <p class="search-status" id="searchStatus"></p>
    <ul id="searchResults" class="entry-list"></ul>
  </section>

  <div id="entryModal" class="entry-modal" hidden>
    <div class="entry-modal-backdrop" id="modalBackdrop"></div>
    <div class="entry-card" role="dialog" aria-modal="true">
      <button class="entry-close" id="entryClose" aria-label="بند کریں">×</button>
      <div class="entry-card-num" id="entryNum"></div>
      <h2 class="entry-card-title" id="entryTitle"></h2>
      <div class="page-divider" aria-hidden="true">
        <svg viewBox="0 0 100 12" width="100" height="12"><path d="M0 6 L40 6 M60 6 L100 6" stroke="currentColor" stroke-width="1"/><circle cx="50" cy="6" r="3" fill="currentColor"/></svg>
      </div>
      <p class="entry-card-meaning" id="entryMeaning"></p>
      <div class="entry-card-stage" id="entryStageLabel"></div>
    </div>
  </div>

  <div id="loadingState" class="loading-state">
    <div class="moon-loader"></div>
    <p>خوابوں کی کتاب کھولی جا رہی ہے...</p>
  </div>

</main>

<footer class="app-footer">
  <span>خواب نامہ یوسفی · M Ijaz · GHS 124/NB</span>
</footer>

<script src="script.js"></script>
</body>
</html>
